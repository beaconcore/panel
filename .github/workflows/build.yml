name: Build

on:
  push:
    branches:
      - master
    pull_request:

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [24]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
